name: CI

# install → lint/typecheck → test (+coverage, contract drift) → build → e2e (+a11y, API fuzz)
# → security. Make every job below a required status check on `main` (see
# docs/runbooks/github-setup.md). Third-party actions are pinned to commit SHAs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, format, commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm exec turbo run lint typecheck
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

  test:
    name: Unit + integration tests, coverage, contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://bseat:bseat@localhost:5433/bseat
      DATABASE_URL_TEST: postgres://bseat:bseat@localhost:5433/bseat_test
      REDIS_URL: redis://localhost:6380
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      BETTER_AUTH_SECRET: ci-only-insecure-secret-0000000000000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Start Postgres, Redis, Mailpit (same compose file as local dev)
        run: docker compose up -d --wait postgres redis mailpit
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test:coverage
      - name: OpenAPI contract is up to date
        run: |
          pnpm --filter @bseat/api gen:openapi
          git diff --exit-code -- apps/api/openapi.json \
            || (echo "::error::apps/api/openapi.json is stale. Run 'bin/pnpm gen:api' and commit." && exit 1)
      - name: Migrations are up to date with the schema
        run: |
          pnpm --filter @bseat/api exec drizzle-kit generate --name ci-check
          git status --porcelain apps/api/drizzle | grep . \
            && (echo "::error::Schema changed without a migration. Run db:generate." && exit 1) || true
      - name: Coverage ≥ 80% on changed lines
        if: github.event_name == 'pull_request'
        run: |
          # vitest writes package-relative paths; make them repo-relative for diff-cover
          for pkg in apps/api apps/web; do
            sed -i "s#^SF:\(src/\)#SF:${pkg}/\1#" "$pkg/coverage/lcov.info"
          done
          pipx run diff-cover==9.7.2 apps/api/coverage/lcov.info apps/web/coverage/lcov.info \
            --compare-branch=origin/${{ github.base_ref }} --fail-under=80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: '*/*/coverage/'
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build

  e2e:
    name: E2E + accessibility + API fuzzing
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build toolbox image
        run: docker compose build install
      - name: Start the full stack
        run: docker compose up -d --wait
      - name: Playwright (Chromium + mobile) with axe WCAG 2.1 AA
        run: docker compose --profile e2e run --rm e2e
      - name: Schemathesis contract fuzzing against the running API
        run: |
          docker run --rm --network host schemathesis/schemathesis:4.32.3 \
            run http://localhost:3001/openapi.json \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance \
            --max-examples 50
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  security:
    name: Secrets, SAST, dependency and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: bin/gitleaks git --redact --no-banner -v
      - name: Semgrep SAST
        run: bin/security semgrep
      - name: Trivy (lockfile CVEs + IaC misconfig)
        run: bin/security trivy
      - name: Build production images
        run: |
          docker build -f docker/api.Dockerfile -t bseat-api:ci .
          docker build -f docker/web.Dockerfile -t bseat-web:ci .
      - name: Trivy image scan
        run: |
          for image in bseat-api:ci bseat-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
