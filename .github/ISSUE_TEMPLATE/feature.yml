name: Feature request
description: Propose a feature. It becomes a spec in specs/NNN-<feature>/spec.md.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
      description: Who needs this and why? ("As a <user> I want <goal> so that <benefit>")
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements, ideally Given / When / Then.
    validations: { required: true }
  - type: textarea
    id: non-goals
    attributes:
      label: Out of scope
  - type: textarea
    id: notes
    attributes:
      label: Notes, designs, links
