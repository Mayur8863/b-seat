version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces (pnpm-lock.yaml)
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    commit-message: { prefix: 'chore(deps)' }
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      react-next: { patterns: ['next', 'react', 'react-dom', '@next/*', '@types/react*'] }
      testing: { patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/*', 'msw'] }
      lint: { patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*'] }
      opentelemetry: { patterns: ['@opentelemetry/*'] }
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose: see docs/adr/0002 (tooling not yet compatible)
      - dependency-name: typescript
        versions: ['>=6.1']
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(ci)' }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(infra)' }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(infra)' }
