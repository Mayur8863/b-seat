name: bseat

# Local development stack. `docker compose up` installs deps, migrates + seeds
# the DB, and runs web (http://localhost:3000) and api (http://localhost:3001)
# with hot reload. Works without a .env file (dev defaults below); copy
# .env.example to .env to override.
#
# The repo is mounted at the same absolute path as on the host (${PWD}), so
# paths in tool output, git hooks and caches are identical inside and outside
# containers. Always run compose from the repo root (bin/* scripts do this).

x-node: &node
  image: bseat-tools:dev
  build: { context: docker, dockerfile: tools.Dockerfile }
  init: true # reap orphaned dev-server processes
  working_dir: ${PWD}
  volumes:
    - .:${PWD}
    - pnpm-store:/home/node/.local/share/pnpm/store
    - corepack-cache:/home/node/.cache/node/corepack
  env_file:
    - path: .env
      required: false
  environment: &node-env
    DATABASE_URL: postgres://${POSTGRES_USER:-bseat}:${POSTGRES_PASSWORD:-bseat}@postgres:5432/${POSTGRES_DB:-bseat}
    DATABASE_URL_TEST: postgres://${POSTGRES_USER:-bseat}:${POSTGRES_PASSWORD:-bseat}@postgres:5432/${POSTGRES_DB:-bseat}_test
    REDIS_URL: redis://redis:6379
    SMTP_HOST: mailpit
    MAILPIT_URL: http://mailpit:8025
    SMTP_PORT: '1025'
    API_INTERNAL_URL: http://api:3001
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-secret-change-me-0000000000}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    # Object storage for space photos (ADR-0011). The key pair is a dev-only credential for
    # the local `storage` server, like BETTER_AUTH_SECRET above; never used outside local dev.
    S3_ENDPOINT: http://storage:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_PORT:-9000}}
    S3_REGION: us-east-1
    S3_BUCKET_PHOTOS: ${S3_BUCKET_PHOTOS:-bseat-photos}
    S3_FORCE_PATH_STYLE: 'true'
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-bseat-dev}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-bseat-dev-secret-key}
    PHOTO_URL_TTL_SECONDS: ${PHOTO_URL_TTL_SECONDS:-3600}

x-healthy: &healthy
  condition: service_healthy

services:
  # ---- infra ---------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bseat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bseat}
      POSTGRES_DB: ${POSTGRES_DB:-bseat}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-bseat_readonly}
    ports: ['${POSTGRES_PORT:-5433}:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bseat} -d ${POSTGRES_DB:-bseat}']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_PORT:-6380}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for space photos (ADR-0011 section 1). SeaweedFS, because
  # MinIO's upstream was archived on 2026-04-25 and ships no new community binaries. It passed
  # the ADR conformance list (see docs/runbooks/local-development.md). Credentials come from the
  # AWS_* variables; there is no anonymous access, so every unsigned request gets 403.
  storage:
    image: chrislusf/seaweedfs:4.51@sha256:3a522c379599e163433a636e75022630848b63a74f08ea37bf06f8d776e9a707
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -master.volumeSizeLimitMB=256
      - -volume.max=40
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-bseat-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-bseat-dev-secret-key}
    ports: ['${S3_PORT:-9000}:9000']
    volumes: [storagedata:/data]
    healthcheck:
      # Unsigned requests are refused with 403 once the S3 gateway is serving.
      test:
        [
          'CMD-SHELL',
          'curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/ | grep -qx 403',
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  # Creates the private photo bucket. Safe to run repeatedly: it exits 0 if the bucket exists.
  storage-init:
    image: amazon/aws-cli:2.39.0@sha256:6014c77975a4ae237395924cc821333f20bf87c91964a45dd4ed5f3b13b424f5
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        i=0
        until aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$BUCKET" >/dev/null 2>&1; do
          i=$$((i + 1)); [ "$$i" -lt 30 ] || { echo "storage-init: bucket $$BUCKET not available" >&2; exit 1; }
          sleep 2
        done
        echo "bucket $$BUCKET ready"
    environment:
      BUCKET: ${S3_BUCKET_PHOTOS:-bseat-photos}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-bseat-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-bseat-dev-secret-key}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    depends_on:
      storage: *healthy

  # Tracing UI at http://localhost:16686 — `docker compose --profile observability up`
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports: ['16686:16686', '4318:4318']

  # ---- app (dev mode, hot reload) ------------------------------------------
  install:
    <<: *node
    command: ['pnpm', 'install', '--frozen-lockfile']

  migrate:
    <<: *node
    environment:
      <<: *node-env
      NODE_ENV: development
      # Password for the seeded demo owner/renter accounts; the seed is its only
      # reader. Dev-only default; a value set in .env also reaches the other node
      # services through env_file. Never set in production.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-dev-only-demo-password-1}
    command: ['bash', '-c', 'pnpm db:migrate && pnpm db:seed']
    depends_on:
      install: { condition: service_completed_successfully }
      postgres: *healthy
      storage-init: { condition: service_completed_successfully }

  api:
    <<: *node
    environment:
      <<: *node-env
      NODE_ENV: development
    command: ['pnpm', 'exec', 'turbo', 'run', 'dev', '--filter=@bseat/api']
    ports: ['${API_PORT:-3001}:3001']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: *healthy
      mailpit: *healthy
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/health/live']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    <<: *node
    environment:
      <<: *node-env
      NODE_ENV: development
    # turbo builds upstream packages first (generates the API client)
    command: ['pnpm', 'exec', 'turbo', 'run', 'dev', '--filter=@bseat/web']
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on:
      install: { condition: service_completed_successfully }
      api: *healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:3000/']
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # ---- browser tests: docker compose --profile e2e run --rm e2e -------------
  # Shares web's network namespace, so the browser sees http://localhost:3000.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    network_mode: service:web
    user: '1000:1000'
    working_dir: ${PWD}/apps/web
    volumes: ['.:${PWD}']
    environment:
      CI: ${CI:-}
      HOME: /tmp
      E2E_BASE_URL: http://localhost:3000
    command: ['npx', 'playwright', 'test']
    depends_on:
      web: *healthy
      storage-forward: { condition: service_started }

  # The browser in e2e shares web's network namespace, where localhost:9000 is not the storage
  # server. Signed photo URLs carry the host `localhost:9000` (S3_PUBLIC_ENDPOINT), so forward
  # that port at the TCP level (the Host header, and so the signature, stays intact).
  storage-forward:
    image: alpine/socat:1.8.1.3@sha256:24adf1bf4b7a34b1be50c4f3bbb1ee6485ccaca4b7555bf02e748537de665f67
    profiles: [e2e]
    network_mode: service:web
    command: ['TCP-LISTEN:9000,fork,reuseaddr', 'TCP:storage:9000']
    depends_on:
      storage: *healthy

  # ---- one-off toolbox: bin/tools <cmd>, bin/pnpm <args> --------------------
  tools:
    <<: *node
    profiles: [tools]
    command: ['bash']

volumes:
  pgdata:
  redisdata:
  storagedata:
  pnpm-store:
  corepack-cache:
